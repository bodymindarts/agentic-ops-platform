on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

name: CI

jobs:
  nix-flake-check:
    name: Nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix flake check
        shell: bash
